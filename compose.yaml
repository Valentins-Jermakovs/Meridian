services:

  # ==============================
  # PostgreSQL
  # ==============================

  postgres:
    image: postgres:18

    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: meridiandatabase

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - back_end


  # ==============================
  # Redis
  # ==============================

  redis:
    image: redis:8

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - back_end


  # ==============================
  # Meridian API
  # ==============================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./app/.env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - back_end


  # ==============================
  # pgAdmin
  # ==============================

  pgadmin:
    image: dpage/pgadmin4:latest

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - back_end


# ==============================
# Persistent Volumes
# ==============================

volumes:

  postgres_data:

  redis_data:

  pgadmin_data:


# ==============================
# Networks
# ==============================

networks:

  back_end:
    external: true